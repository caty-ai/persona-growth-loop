name: tests

on:
  push:
  pull_request:

jobs:
  # The suite is developed and run in production on macOS; this is the merge gate.
  unittest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: TEMP probe — fake-rsync shebang portability
        run: |
          mkdir -p /tmp/probe/pack/catalogs && cd /tmp/probe
          printf '#!/usr/bin/python3\nimport os\nfrom pathlib import Path\nt = Path(os.getcwd()) / "pack/catalogs/oversized.bin"\nt.parent.mkdir(parents=True, exist_ok=True)\nt.write_bytes(b"x"*32)\n' > fake-rsync
          chmod 755 fake-rsync
          ./fake-rsync && ls -la pack/catalogs/ || echo "FAKE-RSYNC-FAILED exit=$?"
          /usr/bin/python3 --version || echo "NO-USR-BIN-PYTHON3"
      - name: Provide the developer-home file the alpha-face fixtures expect
        run: |
          mkdir -p ~/.claude
          printf '{}\n' > ~/.claude/settings.json
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  # Advisory only: Linux support is tracked in issue #1 (the suite still
  # assumes macOS filesystem layout in places). Failures here do not gate.
  unittest-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Provide the developer-home file the alpha-face fixtures expect
        run: |
          mkdir -p ~/.claude
          printf '{}\n' > ~/.claude/settings.json
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
