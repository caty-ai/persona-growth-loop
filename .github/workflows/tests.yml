name: tests

on:
  push:
  pull_request:

jobs:
  # The suite is developed and run in production on macOS; this is the merge gate.
  unittest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Provide the developer-home file the alpha-face fixtures expect
        run: |
          mkdir -p ~/.claude
          printf '{}\n' > ~/.claude/settings.json
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  # Required gate since issue #1: the suite runs portably on Linux
  # (two real-client-rsync dispatcher tests are macOS-only by design).
  unittest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Provide the developer-home file the alpha-face fixtures expect
        run: |
          mkdir -p ~/.claude
          printf '{}\n' > ~/.claude/settings.json
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
