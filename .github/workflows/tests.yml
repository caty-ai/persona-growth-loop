name: tests

on:
  push:
  pull_request:

jobs:
  # The suite is developed and run in production on macOS; this is the merge gate.
  unittest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  # Advisory only: Linux support is tracked in issue #1 (the suite still
  # assumes macOS filesystem layout in places). Failures here do not gate.
  unittest-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
